[project]
name = "One-DM"
version = "0.1.0"
description = "One-Shot Diffusion Mimicker for Handwritten Text Generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Gang Dai"}
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.3", 
    "albumentations>=1.3.1",
    "diffusers>=0.25.0",
    "einops>=0.7.0",
    "ema-pytorch>=0.7.0",
    "imgaug>=0.4.0",
    "opencv-python>=4.8.0",
    "kornia>=0.7.0",
    "pytorch-lightning>=2.1.0",
    "pytorch-metric-learning>=2.3.0",
    "scikit-image>=0.21.0",
    "tensorboard>=2.15.0",
    "torchmetrics>=1.2.0",
    "wandb>=0.16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 更新PyTorch CUDA索引配置
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
] 